# Lashon native tool registry — skeleton.
#
# Enumerates the v1 native tool set from docs/roadmap.md §2.2. This is a
# SKELETON: every tool's `parameters` JSON Schema is authored in Phase 2
# (Milestone M8) and is marked "TODO" until then.
#
# `requires_confirmation` follows the confirmation policy in
# docs/roadmap.md §2.6:
#   true  -> the tool always prompts before it executes.
#   false -> no prompt by default; many of these are user-configurable.
# Conditional cases are noted inline and resolved when the tool is implemented.

