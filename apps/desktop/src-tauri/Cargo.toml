[package]
name = "ottid"
version = "1.1.0"
description = "Ottid — local-first Hebrew voice assistant"
authors = ["Ottid contributors"]
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

# This crate is a thin Tauri GUI shell. Testable logic lives in `ottid-core`.
# `test = false` keeps `cargo test` from building a Tauri-linked test binary,
# which fails to load on Windows. See
# docs/adr/0003-core-logic-in-a-tauri-independent-crate.md.
[lib]
name = "ottid_lib"
test = false
doctest = false

[[bin]]
name = "ottid"
path = "src/main.rs"
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[features]
# Editioning (ADR-0034): `command-mode` forwards to ottid-core's umbrella
# feature. A free `--no-default-features` build ships dictation only — command
# mode (LLM, tools, recipes, local LLM, MCP) is compiled out of the binary.
default = ["command-mode"]
command-mode = ["ottid-core/command-mode"]

[dependencies]
ottid-core = { path = "../../../packages/shared-rust", default-features = false }
tauri = { version = "=2.11.2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-store = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
# Single running instance (issue #12): a second launch focuses the running
# window instead of spawning a duplicate process that would collide on the
# dictation hotkey, the mic, the Whisper model, and the settings store.
tauri-plugin-single-instance = "=2.4.2"
# For parsing `settings:changed` event payloads in the wake-word live reload.
serde_json = "=1.0.149"
# Derive macros for the M7 LLM command surface (LlmMode, etc.).
serde = { version = "=1.0.228", features = ["derive"] }
# Error wrapping / context chains for the M7 Tauri command surface.
anyhow = "=1.0.102"
# Async runtime primitives — `tokio::sync::oneshot` and `tokio::time::timeout`
# for the M8 Command-mode confirmation flow. The full Tokio runtime is
# already brought in by `tauri::async_runtime`; this just pins the surface
# we touch directly. `rt-multi-thread` is for `block_in_place` in the recipe
# approval gate (ADR-0048); Tauri's runtime already turns it on.
tokio = { version = "=1.52.3", features = ["sync", "time", "rt", "rt-multi-thread"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# Rolling on-disk diagnostic log (issue #13) — the file a user can send us when
# a release build (which has no console) errors or crashes. Used synchronously,
# not via `non_blocking`, so the last lines survive a hard abort.
tracing-appender = "=0.2.5"
# The per-user base dirs Tauri resolves its app dirs from, needed before the
# builder runs to move the pre-rename install's data (ADR-0042). The same
# version Tauri already depends on.
dirs = "=6.0.0"
