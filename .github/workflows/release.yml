name: Release

# Triggered on `v*` tag pushes (e.g., v1.2.0). The Windows runner freezes the
# Python STT sidecar with PyInstaller, then builds the NSIS installer and the
# portable zip and uploads them to a *draft* GitHub Release. Nothing is
# published from here: the owner smoke-tests a real install of the draft's
# installer and publishes it by hand (docs/releasing.md).
#
# Signing (docs/adr/0043) — a release is signed twice, independently:
#
#   - Authenticode, with Azure Artifact Signing: every PE image in the build
#     (the app exe, the installer and uninstaller, the NSIS plugins, and every
#     unsigned exe/dll/pyd of the frozen sidecar). GitHub OIDC logs in to
#     Azure, so no signing secret exists. Lives in the `release` environment:
#       secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#       variables ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
#                 ARTIFACT_SIGNING_PROFILE
#   - the updater's minisign signature over the finished installer
#     (docs/adr/0017), from the `release` environment's secrets
#     TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# A run signs when all of the above exist and fails loudly when any is missing
# — unless it is explicitly marked as an unsigned pre-release: a tag carrying
# `-unsigned` (v1.2.0-unsigned.1), or a manual run with `allow_unsigned`
# ticked. Such a build skips both signatures, is released as a pre-release (so
# the `/releases/latest` updater feed never serves it), and says so in its
# release notes.

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch — for debugging the build without cutting a tag. It still
  # creates a draft release, which can be discarded after inspection.
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Allow an unsigned pre-release build when signing is not configured'
        type: boolean
        default: false

# A newer tag push cancels any in-flight release run for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create the GitHub Release and upload assets

env:
  # tauri-apps/tauri-action pinned to the v0.6.2 tag SHA.
  # The v0.5.x series swallowed linuxdeploy's stderr (terse "failed to run
  # linuxdeploy" with no detail) and Ubuntu 24.04 + libfuse2t64 +
  # APPIMAGE_EXTRACT_AND_RUN=1 still didn't produce an AppImage — see PRs
  # #50, #51 from the v0.6.0 release. The v0.6.x series bundles a newer
  # linuxdeploy and surfaces errors. Bump along with a Cargo/npm version
  # bump.
  TAURI_ACTION_SHA: 84b9d35b5fc46c1e45415bdb6144030364f7ebc5

jobs:
  # ── Signing gate ─────────────────────────────────────────────────────────────
  # Decides, before the long build starts, whether this run signs. It fails the
  # run when signing is not configured and the run is not an explicitly
  # unsigned pre-release (docs/adr/0043).
  signing:
    name: signing gate
    runs-on: ubuntu-24.04
    # The signing secrets and variables live in this environment. Its
    # deployment rules decide which refs may sign (tags `v*`, and `main` for
    # manual runs), and Azure trusts only this environment's OIDC subject.
    environment: release
    permissions: {}
    outputs:
      sign: ${{ steps.gate.outputs.sign }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Decide whether this build is signed
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ALLOW_UNSIGNED_INPUT: ${{ inputs.allow_unsigned || false }}
          HAS_AUTHENTICODE: >-
            ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != ''
            && secrets.AZURE_SUBSCRIPTION_ID != '' && vars.ARTIFACT_SIGNING_ENDPOINT != ''
            && vars.ARTIFACT_SIGNING_ACCOUNT != '' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          allow_unsigned=false
          case "$EVENT" in
            push)              [[ "$REF_NAME" == *-unsigned* ]] && allow_unsigned=true ;;
            workflow_dispatch) [[ "$ALLOW_UNSIGNED_INPUT" == true ]] && allow_unsigned=true ;;
          esac

          missing=()
          [[ "$HAS_AUTHENTICODE" == true ]] \
            || missing+=("Authenticode (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ARTIFACT_SIGNING_ENDPOINT/_ACCOUNT/_PROFILE)")
          [[ "$HAS_UPDATER_KEY" == true ]] \
            || missing+=("the updater key (TAURI_SIGNING_PRIVATE_KEY)")

          # An explicitly unsigned build skips signing even when it is
          # configured, so the escape hatch still works if signing breaks.
          if [[ "$allow_unsigned" == true ]]; then
            sign=false
            echo "::warning title=Unsigned pre-release::Explicitly unsigned: both signatures are skipped. This build is marked as a pre-release and the in-app updater will not serve it."
          elif (( ${#missing[@]} == 0 )); then
            sign=true
            echo "Signing is configured: Authenticode + updater signature."
          else
            echo "::error title=Signing is not configured::Missing in the 'release' environment: ${missing[*]}. A release is never published unsigned (docs/adr/0043). For a deliberate unsigned pre-release, push a tag containing '-unsigned' (e.g. v1.2.0-unsigned.1) or tick 'allow_unsigned' on a manual run."
            exit 1
          fi

          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "prerelease=$allow_unsigned" >> "$GITHUB_OUTPUT"

  # ── Per-OS build matrix ──────────────────────────────────────────────────────
  build:
    name: build (${{ matrix.os }})
    needs: signing
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write   # create the GitHub Release and upload assets
      id-token: write   # GitHub OIDC → Azure, for Artifact Signing
    env:
      # Read by scripts/sign-windows.ps1 (docs/adr/0043) — from the sidecar
      # step, from inside `tauri build`, and for the portable exe. Empty, and
      # unused, on an unsigned pre-release.
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The free (dictation-only) edition, Windows-only (ADR-0033,
          # ADR-0039). `--no-default-features` drops command mode (ADR-0034);
          # the frontend free flag is VITE_OTTID_EDITION in the build step env.
          # `tauri_config` is merged over tauri.conf.json and swaps in the free
          # bundle.resources, which leaves out the full edition's llama-server,
          # ottid-mcp and starter recipes (ADR-0049). A full-edition entry sets
          # none. The signing arguments are added per run (the `tauri-args` step).
          - os: windows-2022
            sidecar_name: ottid-stt.exe
            bundles: nsis
            cargo_args: --no-default-features
            tauri_config: tauri.free.conf.json
          # macOS (macos-14 / macos-13 DMGs) and the Linux AppImage are dropped
          # for v1.0.0 — Windows-first (ADR-0033). Re-add the per-arch macOS
          # matrix entries (and the Linux libfuse2 remediation, PRs #50–#52)
          # when those platforms ship.

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ──────────────────────────────────────────────────

      - name: Install Linux system dependencies (Tauri / WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            libfuse2t64
          # libfuse2t64 is the Ubuntu 24.04 (noble) replacement for the
          # legacy libfuse2 transition package. linuxdeploy runs as an
          # AppImage and the AppImage runtime needs libfuse2 at execution
          # time; without it `tauri build --bundles appimage` fails with
          # the terse `failed to run linuxdeploy`.

      # ── Toolchain setup ──────────────────────────────────────────────────────

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/desktop/.nvmrc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust (pinned by rust-toolchain.toml)
        run: |
          rustup show
          # Explicit target install for per-arch macOS builds (matrix targets
          # are aarch64-apple-darwin on macos-14 and x86_64-apple-darwin on
          # macos-13). On other runners this is a no-op.
          case "${{ matrix.os }}" in
            macos-14) rustup target add aarch64-apple-darwin ;;
            macos-13) rustup target add x86_64-apple-darwin ;;
          esac

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # ── STT sidecar: freeze with PyInstaller ─────────────────────────────────
      #
      # PyInstaller cannot cross-compile — each OS must freeze its own sidecar.
      # The `build` extra installs PyInstaller; it is deliberately GPL-isolated
      # from the runtime dependencies so the CI license scan stays clean
      # (docs/adr/0006, .github/workflows/ci.yml).
      #
      # macOS: the `cuda` extra is NOT installed — CUDA is NVIDIA/x86_64 only.
      #         The macOS sidecar is CPU-only (docs/packaging-macos.md).
      # Linux: `cuda` is also omitted here so the base runner (no GPU) builds
      #         cleanly. CUDA wheels are downloaded on first run when nvidia-smi
      #         is present, exactly as on Windows (docs/adr/0006).

      - name: Install STT sidecar Python dependencies (with build extra)
        working-directory: services/stt-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      # Generate the Python gRPC stubs (stt_pb2.py + stt_pb2_grpc.py) so
      # PyInstaller bundles real files instead of an empty `_generated/`.
      # codegen.ensure_stubs() generates them on demand at runtime when the
      # sidecar is run from source, but inside a frozen PyInstaller bundle
      # the path math for repo_root() doesn't resolve, so the runtime
      # fallback can't find packages/proto/stt.proto — the sidecar dies on
      # startup with FileNotFoundError. Generating at build time bypasses
      # this entirely (docs/adr/0006).
      - name: Generate gRPC stubs for the Python sidecar
        working-directory: services/stt-sidecar
        run: |
          python -m grpc_tools.protoc \
            -I../../packages/proto \
            --python_out=src/ottid_stt/_generated \
            --grpc_python_out=src/ottid_stt/_generated \
            ../../packages/proto/stt.proto
          ls -la src/ottid_stt/_generated/

      - name: Freeze the STT sidecar with PyInstaller
        working-directory: services/stt-sidecar
        run: |
          python -m PyInstaller --noconfirm --clean PyInstaller.spec

      # ── Sidecar smoke-test (macOS — diagnose unsigned-binary issues) ────────
      #
      # Runs the freshly-frozen sidecar for a few seconds with no environment
      # set, captures stdout/stderr, and dumps codesign + file inspection.
      # The sidecar should print `OTTID_STT_TOKEN=<hex>` and
      # `OTTID_STT_PORT=<port>` within ~5 s if it boots. If amfid kills the
      # unsigned aarch64 binary, we capture the "Killed: 9" signal here so
      # the failure mode is visible in the CI log instead of as a downstream
      # "transcription doesn't work" report.

      - name: Smoke-test the frozen sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: services/stt-sidecar/dist/ottid-stt
        run: |
          set +e
          echo "=== binary metadata ==="
          file ./ottid-stt
          ls -la ./ottid-stt
          echo
          echo "=== codesign --verify ==="
          codesign --verify --verbose ./ottid-stt
          echo "verify_exit=$?"
          echo
          echo "=== codesign --display ==="
          codesign -dvv ./ottid-stt 2>&1 || true
          echo
          echo "=== launch the sidecar (background + 10 s kill) ==="
          # Spawn the sidecar; wait 10 s; kill if still running; capture
          # any stdout/stderr and the exit code. We do NOT set
          # OTTID_MODELS_ROOT etc — the sidecar should at least print
          # its handshake lines (OTTID_STT_TOKEN=, OTTID_STT_PORT=)
          # quickly, even before it tries to load a model.
          ./ottid-stt > /tmp/sidecar.stdout 2> /tmp/sidecar.stderr &
          SIDECAR_PID=$!
          sleep 10
          if kill -0 $SIDECAR_PID 2>/dev/null; then
            echo "(sidecar still running after 10 s — killing)"
            kill $SIDECAR_PID 2>/dev/null || true
            sleep 1
            kill -9 $SIDECAR_PID 2>/dev/null || true
            STILL_RUNNING=1
          else
            STILL_RUNNING=0
          fi
          wait $SIDECAR_PID 2>/dev/null
          RC=$?
          echo
          echo "=== stdout (first 60 lines) ==="
          head -60 /tmp/sidecar.stdout || true
          echo
          echo "=== stderr (first 60 lines) ==="
          head -60 /tmp/sidecar.stderr || true
          echo
          echo "=== sidecar exit code: $RC (still_running_at_10s=$STILL_RUNNING) ==="
          case $RC in
            137) echo "(137: SIGKILL — likely amfid rejected the unsigned binary)" ;;
            134) echo "(134: SIGABRT — assert/abort from inside the binary)" ;;
            139) echo "(139: SIGSEGV — segfault)" ;;
            143) echo "(143: SIGTERM — clean kill from our 10s timeout, sidecar was running)" ;;
            0)   echo "(0: clean exit — probably hit EOF on stdin)" ;;
            *)   echo "(other exit code: see stderr above for the actual error)" ;;
          esac
          echo
          echo "=== syslog entries mentioning ottid-stt or amfid in the last 2 min ==="
          log show --predicate 'process == "amfid" OR senderImagePath CONTAINS[c] "ottid-stt" OR eventMessage CONTAINS[c] "ottid-stt"' --last 2m 2>&1 | head -60 || true
          # Always succeed — this step is diagnostic. The real signal is the
          # output above, captured into the CI log.
          true

      # Stage the frozen sidecar bundle where Tauri's bundle.resources expects it.
      - name: Stage the frozen sidecar for Tauri
        run: |
          TARGET=apps/desktop/src-tauri/binaries/ottid-stt
          rm -rf "$TARGET"
          cp -r services/stt-sidecar/dist/ottid-stt "$TARGET"
          echo "Staged sidecar — listing:"
          ls -la "$TARGET/"

      # ── Claude Code hook client (docs/adr/0050) ──────────────────────────────
      #
      # The command-mode edition ships `ottid-hook`, which Claude Code runs as
      # its PermissionRequest hook once the user installs it from the Hub.
      # The free edition has no bridge, so it stages nothing here. Staged
      # before the signing step, which signs everything under binaries/.
      - name: Build and stage the hook client (command-mode edition)
        if: ${{ !contains(matrix.cargo_args, '--no-default-features') }}
        run: |
          cargo build --release --locked -p ottid-core --bin ottid-hook
          TARGET=apps/desktop/src-tauri/binaries/ottid-hook
          case "${{ runner.os }}" in
            Windows) cp target/release/ottid-hook.exe "$TARGET/" ;;
            *) cp target/release/ottid-hook "$TARGET/" ;;
          esac
          ls -la "$TARGET/"

      # ── Frontend ─────────────────────────────────────────────────────────────

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # ── Authenticode signing (docs/adr/0043) ─────────────────────────────────
      #
      # signtool and the Artifact Signing dlib come from nuget.org, pinned to an
      # exact version and to the SHA-512 nuget.org records for that package.
      # Tauri's own already-signed check runs signtool too, so it gets the same
      # pinned copy (TAURI_WINDOWS_SIGNTOOL_PATH).

      - name: Install the signing tools
        if: runner.os == 'Windows' && needs.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'signing-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $packages = @(
            @{ Id = 'microsoft.windows.sdk.buildtools'; Version = '10.0.28000.2705'
               Sha512 = '47kp42eMb8rF3bjDuZHVkzGRb9Fr7wyFZDIT2sWr3StwnTCoDHIisDe0SPWGwerwVUw/eQQO/OxDb0YYHbfNvA==' }
            @{ Id = 'microsoft.artifactsigning.client'; Version = '1.0.128'
               Sha512 = 'mPBqaR9Pwvoi8Z3PhVZzPphgf775GjEsRTubB5jMkIja4KyzbjibVSoRtNIyAyR4W4VBwrUQkackwFvF31y/lQ==' }
          )
          foreach ($p in $packages) {
            # A .nupkg is a zip; the .zip name lets Expand-Archive take it.
            $nupkg = Join-Path $tools "$($p.Id).$($p.Version).zip"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$($p.Id)/$($p.Version)/$($p.Id).$($p.Version).nupkg" -OutFile $nupkg
            $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($nupkg)))
            if ($sha512 -ne $p.Sha512) { throw "$($p.Id) $($p.Version): SHA-512 mismatch ($sha512)" }
            Expand-Archive -LiteralPath $nupkg -DestinationPath (Join-Path $tools $p.Id)
          }
          $signtool = Join-Path $tools 'microsoft.windows.sdk.buildtools\bin\10.0.28000.0\x64\signtool.exe'
          $dlib = Join-Path $tools 'microsoft.artifactsigning.client\bin\x64\Azure.CodeSigning.Dlib.dll'
          foreach ($f in $signtool, $dlib) { if (-not (Test-Path $f)) { throw "missing $f" } }
          "OTTID_SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "OTTID_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "TAURI_WINDOWS_SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      # The OIDC assertion azure/login trades in lives only minutes, but the
      # Artifact Signing access token it buys lives about an hour, and `az`
      # caches it for every signtool process that follows. So log in and fetch
      # that token right before the signing starts — the sidecar step, then the
      # Tauri build, then the portable exe all reuse it.
      - name: Log in to Azure (GitHub OIDC)
        if: runner.os == 'Windows' && needs.signing.outputs.sign == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch the Artifact Signing access token
        if: runner.os == 'Windows' && needs.signing.outputs.sign == 'true'
        run: az account get-access-token --scope https://codesigning.azure.net/.default --output none

      # Every PE image in the staged resources that is not already validly
      # signed (by Microsoft, NVIDIA, …): the sidecar's exe, dlls and pyd
      # modules, and llama-server and ottid-mcp when a full-edition build
      # stages them. Tauri would sign only the exe/dll ones, one process per
      # file, and leave the pyd modules unsigned — and Smart App Control
      # checks every module.
      - name: Sign the bundled binaries
        if: runner.os == 'Windows' && needs.signing.outputs.sign == 'true'
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Tree apps/desktop/src-tauri/binaries

      # Signed: merge tauri.signing.conf.json, whose signCommand runs
      # scripts/sign-windows.ps1 for the app exe, the NSIS plugins, the
      # installer and the uninstaller; the updater .sig follows from the
      # TAURI_SIGNING_* key. Unsigned pre-release: `--no-sign` skips both.
      # The --config paths are absolute because tauri-action and the Tauri CLI
      # resolve relative ones from different directories. The Tauri CLI merges
      # them in order, so the edition config goes first.
      - name: Choose the Tauri build arguments
        id: tauri-args
        run: |
          edition=""
          if [[ -n "${{ matrix.tauri_config }}" ]]; then
            edition="--config ${GITHUB_WORKSPACE//\\//}/apps/desktop/src-tauri/${{ matrix.tauri_config }}"
          fi
          if [[ "${{ needs.signing.outputs.sign }}" == true ]]; then
            signing="--config ${GITHUB_WORKSPACE//\\//}/apps/desktop/src-tauri/tauri.signing.conf.json"
          else
            signing="--no-sign"
          fi
          echo "args=--bundles ${{ matrix.bundles }} $edition $signing -- ${{ matrix.cargo_args }}" >> "$GITHUB_OUTPUT"

      # ── Tauri build & release upload ─────────────────────────────────────────
      #
      # tauri-apps/tauri-action@SHA:
      #   - Compiles the Tauri app and bundles the per-OS installer.
      #   - Creates (or updates) the GitHub Release for this tag.
      #   - Uploads the installer as a release asset.
      #
      # Windows:  NSIS installer (.exe) + portable zip (packaged in the next step)
      # macOS:    .dmg — UNSIGNED (Gatekeeper will warn until M13 obtains an
      #            Apple Developer ID and notarizes; see docs/adr/0018 and
      #            docs/packaging-macos.md).
      # Linux:    .AppImage — no signing required; world-executable on extraction.

      - name: Build and upload the Tauri installer
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free (dictation-only) edition: tree-shake the command-mode Hub
          # surface out of the frontend bundle (ADR-0034). Pairs with
          # `--no-default-features` in the matrix tauri_args, which drops the
          # command-mode Rust. Both are required — the Vite build can't see the
          # Cargo feature flags.
          VITE_OTTID_EDITION: free
          # Minisign key for tauri-plugin-updater (docs/adr/0017). The CLI
          # signs the installer after Authenticode has, so the .sig covers the
          # final bytes. Ignored under `--no-sign`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy and its plugins ship as AppImages whose runtime mounts
          # itself via FUSE — fragile on GitHub-hosted Ubuntu 24.04 even with
          # libfuse2t64 installed. APPIMAGE_EXTRACT_AND_RUN=1 tells the
          # runtime to extract the AppImage to a temp dir and run from there
          # instead, bypassing FUSE entirely. No-op on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ottid ${{ github.ref_name }}'
          releaseBody: |
            Lashon is now **Ottid** (אוטיד): the same local-first, Hebrew-first
            dictation app under its new name.

            - **Upgrading from Lashon:** run this installer. It removes the old
              Lashon app and keeps your data. On first launch Ottid moves your
              settings, history, logs and the downloaded models into its own
              data folder, so nothing is downloaded again.
            - **Data folder:** `%LOCALAPPDATA%\app.ottid.desktop`. If you hit an
              error, open the tray menu (or right-click Ottid) → **Open logs
              folder** and attach it to a bug report. The log records only
              diagnostic events — never your transcribed text or audio.
            - **Wake word:** still "Hey Lashon" until a model for the new name
              is trained.

            ${{ needs.signing.outputs.sign == 'true' && '**Signed build:** the installer and the app are code-signed. A new release can still meet a Windows SmartScreen notice for its first days, until Microsoft has seen enough installs of it.' || '**Unsigned pre-release (docs/adr/0043):** Windows SmartScreen will warn on first launch — click **More info → Run anyway**. The in-app updater does not offer this build.' }}

            A fresh install downloads the Hebrew STT model + CUDA runtime
            (~2.8 GB) into the app's data directory on first launch.
          releaseDraft: true
          # A normal release is never a pre-release: the GitHub
          # `/releases/latest/download/...` redirect, which tauri-plugin-updater
          # fetches, skips pre-releases (that broke the in-app updater for
          # v0.6.0). Only an explicitly unsigned build is one — which is exactly
          # what keeps the updater from ever serving it.
          prerelease: ${{ needs.signing.outputs.prerelease == 'true' }}
          projectPath: apps/desktop
          args: ${{ steps.tauri-args.outputs.args }}

      # ── Windows portable zip (post-build step) ───────────────────────────────
      #
      # Packages the release .exe + the pristine frozen sidecar bundle into a
      # portable zip per ADR-0012. Built from src-tauri/binaries/ (not from
      # target/release/binaries/) to avoid shipping CUDA libs that a prior run
      # may have extracted there. The sidecar there is already signed (the
      # step above); the exe is not — after bundling, Tauri restores
      # target/release/ottid.exe to its unsigned build — so the staged copy is
      # signed here.

      - name: Package the Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SIGN: ${{ needs.signing.outputs.sign }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $stage = "$env:RUNNER_TEMP\ottid-portable"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory "$stage\binaries" | Out-Null
          Copy-Item target\release\ottid.exe $stage
          if ($env:SIGN -eq 'true') { ./scripts/sign-windows.ps1 "$stage\ottid.exe" }
          Copy-Item -Recurse apps\desktop\src-tauri\binaries\ottid-stt "$stage\binaries\ottid-stt"
          $zip = "target\release\bundle\Ottid-${version}-windows-x64-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          echo "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      # Proves the signing end to end: installs the installer silently — the
      # only way to see the uninstaller NSIS writes at install time — and fails
      # unless the installer and every PE image installed, plus every one in
      # the portable tree, carries a valid signature. installMode "both" makes
      # NSIS's MultiUser reset $INSTDIR after /D= is read, so the step installs
      # per-user and takes the folder from the installer's uninstall record.
      # The installer is already on the draft release by now; a red run means
      # that draft must not be published.
      - name: Verify the Authenticode signatures
        if: runner.os == 'Windows' && needs.signing.outputs.sign == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/CurrentUser' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install exited with $($p.ExitCode)" }
          $product = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          $record = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$product"
          $installDir = $record.InstallLocation.Trim('"')
          if (-not (Test-Path "$installDir\uninstall.exe")) { throw "no uninstall.exe in $installDir" }
          ./scripts/sign-windows.ps1 -Verify $installer.FullName $installDir "$env:RUNNER_TEMP\ottid-portable"

      - name: Upload Windows portable zip to the release
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tauri-action's `releaseId` output is the GitHub-side numeric id
          # of the release it created/updated. `gh release upload --clobber`
          # attaches the zip to that exact release without needing the
          # legacy upload_url (the actions/upload-release-asset@v1 action is
          # itself archived and was the source of the previous breakage).
          gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE_ZIP }}" \
            --clobber --repo "${{ github.repository }}"

  # ── License gate ─────────────────────────────────────────────────────────────
  # Re-run the same license check that CI runs, to block a tag push that
  # accidentally introduced a GPL/AGPL/CC-BY-NC dependency.
  license-scan:
    name: license scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo-deny — Rust license check
        run: cargo deny check licenses

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-licenses and sidecar dependencies
        run: |
          pip install pip-licenses==5.5.5
          pip install ./services/stt-sidecar

      - name: pip-licenses — fail on copyleft / non-commercial
        run: pip-licenses --fail-on="GPL;LGPL;AGPL;CC-BY-NC"
